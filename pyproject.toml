[project]
name = "amazon-seller-mcp"
version = "0.2.0"
description = "Servidor MCP que dá ao Claude acesso aos relatórios e preços da conta Amazon Seller (SP-API)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
amazon-seller-mcp = "amazon_seller_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amazon_seller_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
